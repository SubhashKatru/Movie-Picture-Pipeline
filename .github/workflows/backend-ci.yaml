name: Backend Continuous Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate lint and test failures (for evidence screenshots)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pipenv
        run: pip install pipenv
      - name: Restore pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: pipenv-${{ runner.os }}-
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run lint
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            pipenv run lint-fail
          else
            pipenv run lint
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pipenv
        run: pip install pipenv
      - name: Restore pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: pipenv-${{ runner.os }}-
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run tests
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then export FAIL_TEST=true; fi
          pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build docker image
        run: docker build --tag mp-backend:${{ github.sha }} .
